<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MÜPHEM | AR</title><script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script><style>body{margin:0;background:#102e32;color:#f5f1e8;font:16px system-ui}#intro{position:fixed;inset:0;z-index:10000;display:grid;place-content:center;text-align:center;padding:24px;background:#102e32}h1{letter-spacing:.2em}button{padding:14px 24px;background:#f5f1e8;color:#102e32;font:inherit;border:0;border-radius:4px}#status{position:fixed;bottom:24px;left:12px;right:12px;text-align:center;z-index:9999;background:#102e32dd;padding:12px;pointer-events:none}#overlay{position:fixed;z-index:9998;left:50%;top:50%;transform:translate(-50%,-50%);width:min(90vw,75vh);height:auto;pointer-events:none}#source{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}small{margin:12px}</style></head><body><div id="intro"><h1>MÜPHEM</h1><p>Artırılmış gerçeklik / Augmented reality</p><button id="start">Deneyimi başlat / Start</button><small id="error">Kamera izni gereklidir / Camera access required</small></div><div id="status" hidden>Kameranızı esere yöneltin.<br>Point your camera at the artwork.</div><video id="source" src="./animation.mp4?v=3" preload="auto" loop muted playsinline webkit-playsinline></video><canvas id="overlay" width="600" height="618" hidden></canvas><a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: no; uiLoading: no; uiError: no" renderer="alpha: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded><a-camera position="0 0 0" look-controls="enabled: false"></a-camera><a-entity id="target" mindar-image-target="targetIndex: 0"></a-entity></a-scene><script>
const scene=document.querySelector('a-scene'), video=document.querySelector('#source'), canvas=document.querySelector('#overlay'), ctx=canvas.getContext('2d',{willReadFrequently:true}), intro=document.querySelector('#intro'), status=document.querySelector('#status'), start=document.querySelector('#start'), error=document.querySelector('#error'), target=document.querySelector('#target');let active=false,found=false,ready=false;video.muted=true;
start.onclick=async()=>{start.disabled=true;try{await video.play();if(!scene.hasLoaded)await new Promise(r=>scene.addEventListener('loaded',r,{once:true}));await scene.systems['mindar-image-system'].start();}catch(e){error.textContent='Başlatılamadı / Could not start: '+e.message;start.disabled=false;}};
scene.addEventListener('arReady',()=>{ready=true;intro.style.display='none';status.hidden=active;});scene.addEventListener('arError',()=>{intro.style.display='grid';error.textContent='Kamera açılamadı / Camera could not start';start.disabled=false;});
target.addEventListener('targetFound',()=>{found=true;if(!active){active=true;video.currentTime=0;video.play().catch(()=>{});canvas.hidden=false;status.hidden=true;requestAnimationFrame(draw);}});target.addEventListener('targetLost',()=>{found=false;});
function draw(){if(!active)return; if(video.readyState>=2){ctx.drawImage(video,0,0,canvas.width,canvas.height);const im=ctx.getImageData(0,0,canvas.width,canvas.height),d=im.data;for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2],ex=g-Math.max(r,b);const key=Math.max(0,Math.min(1,(ex-35)/65))*Math.max(0,Math.min(1,(g-100)/70));d[i+3]=Math.round(255*(1-key));if(key>0)d[i+1]=Math.round(g*(1-key)+Math.max(r,b)*key);}ctx.putImageData(im,0,0);}
if(found&&scene.camera){const T=AFRAME.THREE, a=new T.Vector3(0,0,0),b=new T.Vector3(.5,0,0),c=new T.Vector3(-.5,0,0);target.object3D.localToWorld(a);target.object3D.localToWorld(b);target.object3D.localToWorld(c);a.project(scene.camera);b.project(scene.camera);c.project(scene.camera);const rect=scene.canvas.getBoundingClientRect();const w=Math.hypot((b.x-c.x)*rect.width/2,(b.y-c.y)*rect.height/2);if(Number.isFinite(w)&&w>10){canvas.style.left=(rect.left+(a.x+1)*rect.width/2)+'px';canvas.style.top=(rect.top+(1-a.y)*rect.height/2)+'px';canvas.style.width=Math.min(w*.95,innerWidth*1.5)+'px';}}else{canvas.style.left='50%';canvas.style.top='50%';canvas.style.width='min(90vw,75vh)';}requestAnimationFrame(draw);}
</script></body></html>
