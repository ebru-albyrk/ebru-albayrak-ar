<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MÜPHEM | AR</title><script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script><style>html,body{width:100%;height:100%;overflow:hidden;touch-action:none}a-scene{position:fixed!important;inset:0!important;width:100%!important;height:100%!important}a-scene canvas{width:100%!important;height:100%!important}body{margin:0;background:#102e32;color:#f5f1e8;font:16px system-ui}#intro{position:fixed;inset:0;z-index:10000;display:grid;place-content:center;text-align:center;padding:24px;background:#102e32}h1{letter-spacing:.2em}button{padding:14px 24px;background:#f5f1e8;color:#102e32;font:inherit;border:0;border-radius:4px}#status{position:fixed;bottom:24px;left:12px;right:12px;text-align:center;z-index:9999;background:#102e32dd;padding:12px;pointer-events:none}#overlay{position:fixed;z-index:9998;left:50%;top:50%;transform:translate(-50%,-50%);width:min(90vw,75vh);height:auto;pointer-events:none}#source{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}small{margin:12px} .social{margin-top:28px;padding-top:18px;border-top:1px solid #ffffff35;display:grid;gap:9px;font-size:13px;color:#c4d3d0}.social a{color:#f5f1e8;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px;touch-action:manipulation}.social a:focus-visible{outline:2px solid #f5f1e8}</style></head><body><div id="intro"><h1>MÜPHEM</h1><p>Artırılmış gerçeklik / Augmented reality</p><button id="start">Deneyimi başlat / Start</button><small id="error">Kamera izni gereklidir / Camera access required</small><div class="social"><span>Diğer çalışmalar / Explore more</span><a href="https://www.instagram.com/ebrualbayrak.art/" target="_blank" rel="noopener noreferrer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>@ebrualbayrak.art</a></div></div><div id="status" hidden>Kameranızı esere yöneltin.<br>Point your camera at the artwork.</div><video id="source" src="./animation.mp4?v=3" preload="auto" loop muted playsinline webkit-playsinline></video><canvas id="overlay" width="1200" height="1236" hidden></canvas><a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: no; uiLoading: no; uiError: no" renderer="alpha: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded><a-camera position="0 0 0" look-controls="enabled: false"></a-camera><a-entity id="target" mindar-image-target="targetIndex: 0"></a-entity></a-scene><script>
const scene=document.querySelector('a-scene'), video=document.querySelector('#source'), canvas=document.querySelector('#overlay'), gl=canvas.getContext('webgl',{alpha:true,premultipliedAlpha:false}), intro=document.querySelector('#intro'), status=document.querySelector('#status'), start=document.querySelector('#start'), error=document.querySelector('#error'), target=document.querySelector('#target');let active=false,found=false,ready=false;video.muted=true;
start.onclick=async()=>{start.disabled=true;try{await video.play();if(!scene.hasLoaded)await new Promise(r=>scene.addEventListener('loaded',r,{once:true}));await scene.systems['mindar-image-system'].start();}catch(e){error.textContent='Başlatılamadı / Could not start: '+e.message;start.disabled=false;}};
scene.addEventListener('arReady',()=>{ready=true;const cam=document.querySelector('video:not(#source)');if(cam){cam.style.position='fixed';cam.style.objectFit='cover';}window.dispatchEvent(new Event('resize'));intro.style.display='none';status.hidden=active;});scene.addEventListener('arError',()=>{intro.style.display='grid';error.textContent='Kamera açılamadı / Camera could not start';start.disabled=false;});
target.addEventListener('targetFound',()=>{found=true;if(!active){active=true;video.currentTime=0;video.play().catch(()=>{});canvas.hidden=false;status.hidden=true;requestAnimationFrame(draw);}});target.addEventListener('targetLost',()=>{found=false;});
const vs='attribute vec2 p; varying vec2 uv; void main(){uv=vec2((p.x+1.0)*0.5,(1.0-p.y)*0.5);gl_Position=vec4(p,0.0,1.0);}';
const fs='precision mediump float; varying vec2 uv; uniform sampler2D tex; void main(){vec4 c=texture2D(tex,uv);float ex=c.g-max(c.r,c.b);float k=clamp((ex-35.0/255.0)/(65.0/255.0),0.0,1.0)*clamp((c.g-100.0/255.0)/(70.0/255.0),0.0,1.0);c.g=mix(c.g,max(c.r,c.b),k);gl_FragColor=vec4(c.rgb,1.0-k);}';
function shader(type,src){const sh=gl.createShader(type);gl.shaderSource(sh,src);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(sh));return sh;}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);gl.useProgram(program);const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);const loc=gl.getAttribLocation(program,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
let zoom=1,pinchStart=0,zoomStart=1;
function distance(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);}
window.addEventListener("touchstart",e=>{if(active&&e.touches.length===2){e.preventDefault();pinchStart=distance(e.touches);zoomStart=zoom;}},{passive:false});
window.addEventListener("touchmove",e=>{if(active&&e.touches.length===2&&pinchStart>0){e.preventDefault();zoom=Math.max(.5,Math.min(3,zoomStart*distance(e.touches)/pinchStart));}},{passive:false});
for(const event of ["touchend","touchcancel"])window.addEventListener(event,e=>{if(e.touches.length<2)pinchStart=0;});
function draw(){if(!active)return;if(video.readyState>=2){if(canvas.width!==video.videoWidth||canvas.height!==video.videoHeight){canvas.width=video.videoWidth;canvas.height=video.videoHeight;}gl.viewport(0,0,canvas.width,canvas.height);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);}
if(found&&scene.camera){const T=AFRAME.THREE, a=new T.Vector3(0,0,0),b=new T.Vector3(.5,0,0),c=new T.Vector3(-.5,0,0);target.object3D.localToWorld(a);target.object3D.localToWorld(b);target.object3D.localToWorld(c);a.project(scene.camera);b.project(scene.camera);c.project(scene.camera);const rect=scene.canvas.getBoundingClientRect();const w=Math.hypot((b.x-c.x)*rect.width/2,(b.y-c.y)*rect.height/2);if(Number.isFinite(w)&&w>10){canvas.style.left=(rect.left+(a.x+1)*rect.width/2)+'px';canvas.style.top=(rect.top+(1-a.y)*rect.height/2)+'px';canvas.style.width=(Math.min(w*.95,innerWidth*1.5)*zoom)+'px';}}else{canvas.style.left='50%';canvas.style.top='50%';canvas.style.width=(Math.min(innerWidth*.9,innerHeight*.75)*zoom)+'px';}requestAnimationFrame(draw);}
</script></body></html>
