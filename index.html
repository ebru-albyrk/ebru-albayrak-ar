<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MÜPHEM | AR</title><script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script><style>body{margin:0;background:#102e32;color:#f5f1e8;font:16px system-ui}#intro{position:fixed;inset:0;z-index:10;display:grid;place-content:center;text-align:center;padding:24px;background:#102e32}h1{letter-spacing:.2em}button{padding:14px 24px;border:1px solid #eee;background:#f5f1e8;color:#102e32;font:inherit;border-radius:4px}#status{position:fixed;bottom:24px;left:12px;right:12px;text-align:center;z-index:5;background:#102e32dd;padding:12px;border-radius:5px;pointer-events:none}small{display:block;margin:12px}#animation.detached{display:block!important;position:fixed!important;z-index:20;top:50%;left:50%;transform:translate(-50%,-50%);width:min(92vw,75vh);height:auto;max-height:85vh;object-fit:contain;background:#000}</style></head><body><div id="intro"><h1>MÜPHEM</h1><p>Artırılmış gerçeklik / Augmented reality</p><button id="start">Deneyimi başlat / Start</button><small id="error">Kamera izni gereklidir / Camera access required</small></div><div id="status" hidden>Kameranızı esere yöneltin.<br>Point your camera at the artwork.</div><a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: no; uiLoading: no; uiError: no" color-space="sRGB" renderer="colorManagement: true; alpha: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded><a-assets timeout="20000"><video id="animation" src="./animation.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video></a-assets><a-camera position="0 0 0" look-controls="enabled: false"></a-camera><a-entity id="target" mindar-image-target="targetIndex: 0"><a-video src="#animation" width="0.8" height="0.824" position="0 0 0.01" material="shader: flat"></a-video></a-entity></a-scene><script>const scene=document.querySelector('a-scene'),video=document.querySelector('#animation'),intro=document.querySelector('#intro'),status=document.querySelector('#status'),start=document.querySelector('#start'),error=document.querySelector('#error');video.muted=true;start.onclick=async()=>{start.disabled=true;try{video.play().then(()=>{if(!activated)video.pause()}).catch(()=>{});if(!scene.hasLoaded)await new Promise(r=>scene.addEventListener('loaded',r,{once:true}));await scene.systems['mindar-image-system'].start();intro.style.display='none';status.hidden=false;}catch(e){error.textContent='Kamera açılamadı. İzinleri kontrol edin / Check camera permissions. '+e.message;start.disabled=false;}};let found=false,activated=false;document.querySelector('#target').addEventListener('targetFound',()=>{found=true;activated=true;video.classList.remove('detached');document.querySelector('a-assets').appendChild(video);status.hidden=true;video.play().catch(()=>{});});document.querySelector('#target').addEventListener('targetLost',()=>{found=false;if(activated){document.body.appendChild(video);video.classList.add('detached');status.hidden=true;video.play().catch(()=>{});}else{status.hidden=false;}});scene.addEventListener('arError',()=>{intro.style.display='grid';error.textContent='Kamera başlatılamadı / Camera could not start';start.disabled=false;});</script></body></html>
